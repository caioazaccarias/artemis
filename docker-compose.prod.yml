version: '3.8'

# Este arquivo estende o docker-compose.yml para produção.
# Acrescenta o Nginx Proxy Manager global com SSL automático via Let's Encrypt.
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  # ─── Nginx Reverse Proxy (Gerencia todo tráfego 80/443) ───────────────
  nginx-proxy:
    image: nginxproxy/nginx-proxy:alpine
    container_name: artemis_nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
    networks:
      - artemis_network

  # ─── Let's Encrypt SSL Auto (emite e renova certificados) ─────────────
  acme-companion:
    image: nginxproxy/acme-companion
    container_name: artemis_acme
    restart: always
    environment:
      DEFAULT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
      - acme_data:/etc/acme.sh
    depends_on:
      - nginx-proxy
    networks:
      - artemis_network

  # ─── Frontend: expõe ao proxy via variáveis de ambiente ───────────────
  frontend:
    environment:
      VIRTUAL_HOST: ${DOMAIN}
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: ${DOMAIN}

volumes:
  nginx_certs:
  nginx_vhost:
  nginx_html:
  acme_data:
