version: '3.8'

services:
  # ─── Banco de Dados MySQL ─────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: artemis_db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - artemis_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
      interval: 10s

  # ─── API Backend (Node.js) ────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artemis_backend
    restart: always
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - artemis_network

  # ─── Frontend (React + Nginx) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: artemis_frontend
    restart: always
    ports:
      - "8081:80"  # Expõe na porta 8081 para o Coolify/Traefik rotear
    depends_on:
      - backend
    networks:
      - artemis_network

  # ─── Gerenciamento (phpMyAdmin) ──────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: artemis_phpmyadmin
    restart: always
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - artemis_network

networks:
  artemis_network:
    driver: bridge

volumes:
  db_data:
    driver: local
